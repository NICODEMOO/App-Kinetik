name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar proyecto Android
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/kinetik/app
          cat > settings.gradle.kts <<'KINETIK_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Kinetik"
          include(":app")
          KINETIK_EOF
          cat > build.gradle.kts <<'KINETIK_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KINETIK_EOF
          cat > gradle.properties <<'KINETIK_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          KINETIK_EOF
          cat > app/build.gradle.kts <<'KINETIK_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kinetik.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kinetik.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          KINETIK_EOF
          cat > app/src/main/AndroidManifest.xml <<'KINETIK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Android 11 o menor -->
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <!-- Android 12 o mayor ("Dispositivos cercanos") -->
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-feature android:name="android.hardware.bluetooth" android:required="true" />

              <application
                  android:label="KINETIK AI"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KINETIK_EOF
          cat > app/src/main/java/com/kinetik/app/MainActivity.kt <<'KINETIK_EOF'
          package com.kinetik.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothSocket
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.OutputStream
          import java.util.UUID

          /**
           * Cascarón nativo: muestra assets/index.html en un WebView y le presta el
           * Bluetooth clásico (SPP/RFCOMM) del celular a través de window.KinetikBT.
           */
          @SuppressLint("MissingPermission", "SetJavaScriptEnabled")
          class MainActivity : Activity() {

              private lateinit var web: WebView

              @Volatile private var socket: BluetoothSocket? = null
              @Volatile private var out: OutputStream? = null
              @Volatile private var reading = false

              private val sppUuid: UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  web = WebView(this)
                  setContentView(web)

                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true      // localStorage: guarda las sesiones
                  web.settings.allowFileAccess = true
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = WebChromeClient()
                  web.addJavascriptInterface(Bridge(), "KinetikBT")
                  web.loadUrl("file:///android_asset/index.html")
              }

              override fun onDestroy() {
                  closeSocket()
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- permisos
              private fun adapter(): BluetoothAdapter? =
                  (getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager).adapter

              private fun granted(): Boolean =
                  Build.VERSION.SDK_INT < 31 ||
                      checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED

              private fun askPermission() {
                  if (Build.VERSION.SDK_INT >= 31) {
                      requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 1)
                  } else {
                      emit("perm", "1")
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  val ok = res.isNotEmpty() && res[0] == PackageManager.PERMISSION_GRANTED
                  emit("perm", if (ok) "1" else "0")
              }

              // ---------------------------------------------------------------- JS -> nativo
              inner class Bridge {
                  @JavascriptInterface fun available(): Boolean = adapter() != null

                  @JavascriptInterface fun hasPermission(): Boolean = granted()

                  @JavascriptInterface fun requestPermission() {
                      runOnUiThread { askPermission() }
                  }

                  /** JSON [{name,address}] de los dispositivos ya emparejados, o "OFF" si el Bluetooth está apagado. */
                  @JavascriptInterface fun list(): String {
                      val ad = adapter() ?: return "[]"
                      if (!ad.isEnabled) return "OFF"
                      val arr = JSONArray()
                      for (d in ad.bondedDevices) {
                          arr.put(JSONObject().put("name", d.name ?: "").put("address", d.address))
                      }
                      return arr.toString()
                  }

                  @JavascriptInterface fun connect(address: String) {
                      Thread { doConnect(address) }.start()
                  }

                  @JavascriptInterface fun write(text: String) {
                      try {
                          out?.write(text.toByteArray(Charsets.ISO_8859_1))
                          out?.flush()
                      } catch (e: Exception) {
                          if (reading) {
                              closeSocket()
                              emit("closed", "")
                          }
                      }
                  }

                  @JavascriptInterface fun disconnect() {
                      closeSocket()
                  }
              }

              // ---------------------------------------------------------------- Bluetooth
              private fun doConnect(address: String) {
                  closeSocket()
                  try {
                      val ad = adapter() ?: throw Exception("Este celular no tiene Bluetooth")
                      ad.cancelDiscovery()
                      val s = ad.getRemoteDevice(address).createRfcommSocketToServiceRecord(sppUuid)
                      s.connect()
                      socket = s
                      out = s.outputStream
                      reading = true
                      emit("connected", "")
                      startReader(s)
                  } catch (e: Exception) {
                      closeSocket()
                      emit("error", e.message ?: "No se pudo abrir el puerto Bluetooth")
                  }
              }

              private fun startReader(s: BluetoothSocket) {
                  Thread {
                      val buf = ByteArray(512)
                      try {
                          val input = s.inputStream
                          while (reading) {
                              val n = input.read(buf)
                              if (n < 0) break
                              if (n > 0) emit("data", String(buf, 0, n, Charsets.ISO_8859_1))
                          }
                      } catch (_: Exception) {
                      }
                      if (reading && socket === s) {
                          closeSocket()
                          emit("closed", "")
                      }
                  }.start()
              }

              private fun closeSocket() {
                  reading = false
                  try { socket?.close() } catch (_: Exception) {}
                  socket = null
                  out = null
              }

              private fun emit(type: String, msg: String) {
                  runOnUiThread {
                      web.evaluateJavascript(
                          "window.__bt&&window.__bt(${JSONObject.quote(type)},${JSONObject.quote(msg)})", null
                      )
                  }
              }
          }
          KINETIK_EOF
          cp index.html app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kinetik-apk
          path: app/build/outputs/apk/debug/app-debug.apk
